<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1fc0ad" />
    <meta name="description" content="SOLITAIRE: SHIFT — un Klondike lumineux avec des pouvoirs, un mode Aventure, un Chrono et le mode Marée. Sans publicité, sans achat." />
    <title>SOLITAIRE: SHIFT</title>
    <link rel="icon" href="src/assets/icons/icon-192.png" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/cards.css" />
    <link rel="stylesheet" href="styles/ui.css" />
    <link rel="stylesheet" href="styles/bright.css" />

    <!-- installable app (PWA): the basis of the Android build too -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="src/assets/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Solitaire Shift" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand" id="brand">SOLITAIRE<small>SHIFT</small></div>
        <div class="hud">
          <button class="coin-pill" id="btn-shop" title="Salle de jeu" aria-label="Salle de jeu">
            <span class="ico">🪙</span>
            <span class="col"><span class="v" id="hud-coins">0</span><span class="k" id="hud-rate">pièces</span></span>
          </button>
          <div class="stat"><span class="v" id="hud-score">0</span><span class="k">Score</span></div>
          <div class="stat"><span class="v" id="hud-moves">0</span><span class="k">Coups</span></div>
          <div class="stat"><span class="v" id="hud-time">0:00</span><span class="k" id="hud-time-label">Temps</span></div>
          <button class="iconbtn" id="btn-undo" title="Annuler (Z)" aria-label="Annuler">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5h-6"/></svg>
          </button>
          <button class="iconbtn" id="btn-hint" title="Indice (H)" aria-label="Indice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
          </button>
          <button class="iconbtn" id="btn-auto" title="Terminer automatiquement (A)" aria-label="Terminer automatiquement">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <button class="iconbtn" id="btn-menu" title="Menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
        </div>
      </header>

      <!-- Battle mode: health bars, combo and the boss's next-strike warning.
           Empty and hidden in every other mode. -->
      <div class="battle-hud" id="battle-hud"></div>

      <main class="stage" id="stage">
        <div class="board" id="board"></div>
      </main>

      <div class="help-hint" id="help-hint">Glissez les cartes · touchez pour envoyer aux fondations · double-touche pour déplacer automatiquement</div>

      <!-- power bar: spend charges during a hand -->
      <div class="power-bar" id="power-bar"></div>
    </div>

    <!-- Shown only on a portrait phone: the board needs width. Android forces
         landscape via the manifest; a browser cannot, so we ask. -->
    <div class="rotate-hint" id="rotate-hint">
      <div class="glyph">📱</div>
      <h2>Tournez votre écran</h2>
      <p>SOLITAIRE: SHIFT se joue à l'horizontale — les sept colonnes ont besoin
      de largeur pour rester lisibles.</p>
    </div>

    <!-- modal root -->
    <div id="modal-root"></div>
    <div id="toast"></div>
    <div class="confetti" id="confetti"></div>

    <script type="module" src="src/main.js"></script>
    <script>
      // Offline support. Registered outside the module so a service-worker
      // failure can never stop the game itself from loading.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
